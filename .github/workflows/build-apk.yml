name: APK

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      apk_url:
        description: Stock YouTube APK URL (21.13.164 base for RVX 4.3.0)
        required: true
        default: "https://archive.org/download/jhc-apks/apks/com.google.android.youtube/com.google.android.youtube-21.13.164-all.apk"
        type: string
      apk_archs:
        description: Native architectures to keep (e.g. arm64-v8a,armeabi-v7a or arm64-v8a or all)
        required: false
        default: "arm64-v8a,armeabi-v7a"
        type: string
      include_companions:
        description: Also upload MicroG-RE (GmsCore) and YTDLnis downloader companion APKs
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Unit tests & provenance audit
        run: |
          python3 -m unittest discover -s Tests -v
          python3 Tools/audit_provenance.py

  package:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache APK patcher tools
        uses: actions/cache@v4
        with:
          path: |
            .build/apk-cache/morphe-desktop-*.jar
            .build/apk-cache/patches-*.mpp
          key: hh-apk-tools-morphe-2.3.0-rvx-4.3.0

      - name: Inject HH patches into stock YouTube APK
        id: build
        env:
          APK_URL: ${{ inputs.apk_url || 'https://archive.org/download/jhc-apks/apks/com.google.android.youtube/com.google.android.youtube-21.13.164-all.apk' }}
          APK_ARCHS: ${{ inputs.apk_archs || 'arm64-v8a,armeabi-v7a' }}
          GH_TOKEN: ${{ github.token }}
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          if [[ -n "${APK_KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hh-signing.keystore"
            export APK_KEYSTORE="$RUNNER_TEMP/hh-signing.keystore"
          fi
          mkdir -p artifacts
          apk_path="$(bash Scripts/build-apk.sh "$APK_URL")"
          mv -f "$apk_path" "artifacts/$(basename "$apk_path")"
          echo "apk=artifacts/$(basename "$apk_path")" >> "$GITHUB_OUTPUT"

      - name: Fetch companion APKs (MicroG-RE & YTDLnis)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.include_companions }}
        run: |
          mkdir -p companions
          curl --fail --location \
            "https://github.com/MorpheApp/MicroG-RE/releases/download/7.3.1/microg-7.3.1.apk" \
            --output "companions/MicroG-RE_7.3.1_GmsCore.apk"
          python3 Tools/verify_apk.py --package "app.revanced.android.gms" --no-patches "companions/MicroG-RE_7.3.1_GmsCore.apk"

          ytdlnis_tag="$(basename "$(curl --fail --location --silent --output /dev/null --write-out '%{url_effective}' 'https://github.com/deniscerri/ytdlnis/releases/latest')")"
          ytdlnis_path="$(
            curl --fail --location --silent "https://github.com/deniscerri/ytdlnis/releases/expanded_assets/${ytdlnis_tag}" |
            python3 -c 'import re,sys; html=sys.stdin.read(); m=re.search(r"href=\"([^\"]*ytdlnis[^\"]*universal[^\"]*\.apk)\"", html, re.I) or re.search(r"href=\"([^\"]*ytdlnis[^\"]*arm64[^\"]*\.apk)\"", html, re.I); print(m.group(1) if m else "")'
          )"
          if [[ -n "$ytdlnis_path" ]]; then
            ytdlnis_file="companions/YTDLnis_${ytdlnis_tag#v}_Downloader.apk"
            curl --fail --location "https://github.com${ytdlnis_path}" --output "$ytdlnis_file"
            python3 Tools/verify_apk.py --package "com.deniscerri.ytdl" --no-patches "$ytdlnis_file"
          fi

      - name: Publish or attach APKs to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.build.outputs.apk }}" companions/*.apk --clobber
          else
            gh release create "$tag" "${{ steps.build.outputs.apk }}" companions/*.apk \
              --title "HH YouTube ${tag}" \
              --notes "### Android (Injected Stock YouTube APK)
          1. Cài **MicroG-RE_7.3.1_GmsCore.apk** trước tiên để đăng nhập tài khoản Google trên máy chưa root.
          2. Cài **$(basename "${{ steps.build.outputs.apk }}")** (tên ứng dụng **YouTube**, giao diện YouTube gốc 100%, cài đặt **HH** bên trong Settings).
          3. *(Tuỳ chọn)* Cài **YTDLnis** để bấm nút Tải xuống lưu trực tiếp Video 4K / MP3 / Shorts / Playlist."
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: HH-APK
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.include_companions }}
        with:
          name: HH-Android-Companions
          path: companions/*.apk
          if-no-files-found: warn
