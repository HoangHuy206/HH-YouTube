name: APK

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      edition:
        description: "Build edition: allinone (single APK, no GmsCore needed) or rvx (stock YouTube base)"
        required: true
        default: "allinone"
        type: choice
        options:
          - allinone
          - rvx
      apk_arch:
        description: Target architecture for All-in-One APK
        required: false
        default: "arm64-v8a"
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Unit tests & provenance audit
        run: |
          python3 -m unittest discover -s Tests -v
          python3 Tools/audit_provenance.py

  package:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache APK build tools
        uses: actions/cache@v4
        with:
          path: |
            .build/apk-cache/APKEditor-*.jar
            .build/apk-cache/uber-apk-signer-*.jar
            .build/apk-cache/PipePipe_*.apk
            .build/apk-cache/morphe-desktop-*.jar
            .build/apk-cache/patches-*.mpp
          key: hh-apk-tools-v2-${{ inputs.edition || 'allinone' }}-${{ inputs.apk_arch || 'arm64-v8a' }}

      - name: Build HH APK
        id: build
        env:
          HH_APK_EDITION: ${{ inputs.edition || 'allinone' }}
          APK_ARCH: ${{ inputs.apk_arch || 'arm64-v8a' }}
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          if [[ -n "${APK_KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hh-signing.p12"
            export APK_KEYSTORE="$RUNNER_TEMP/hh-signing.p12"
          fi
          mkdir -p artifacts
          apk_path="$(bash Scripts/build-apk.sh "" "$APK_ARCH")"
          mv -f "$apk_path" "artifacts/$(basename "$apk_path")"
          echo "apk=artifacts/$(basename "$apk_path")" >> "$GITHUB_OUTPUT"

      - name: Publish or attach APK to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.build.outputs.apk }}" --clobber
          else
            gh release create "$tag" "${{ steps.build.outputs.apk }}" \
              --title "HH YouTube ${tag}" \
              --notes "### Android (1-File All-in-One APK)
          - Bấm tải trực tiếp file **$(basename "${{ steps.build.outputs.apk }}")** bên dưới về điện thoại Android và cài thẳng (chỉ 1 file duy nhất, tên ứng dụng **YouTube**, không cần root, không cần GmsCore/MicroG)."
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: HH-APK-${{ inputs.edition || 'allinone' }}-${{ inputs.apk_arch || 'arm64-v8a' }}
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error
